<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Jarvis</title>
<style>
  :root {
    --bg: #070b14;
    --panel: #0e1626;
    --panel-edge: #1f3350;
    --text: #dcebfa;
    --muted: #8ea5bd;
    --cyan: #4fe3ff;
    --cyan-dim: #1b7f99;
    --amber: #ffc857;
    --red: #ff4d5e;
    --red-deep: #a31525;
    --green: #5ff0a5;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: 16px 16px 112px;
    color: var(--text);
    font-family: var(--sans);
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(79, 227, 255, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79, 227, 255, .045) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .shell { max-width: 960px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 18px; padding: 8px 0 22px; }
  .reactor {
    position: relative; flex: none; width: 72px; height: 72px; border-radius: 50%;
    background: radial-gradient(circle, #e8fbff 0 10%, var(--cyan) 18%, #0c3a4a 42%, #08121e 66%);
    box-shadow: 0 0 22px rgba(79, 227, 255, .45);
  }
  .reactor::before, .reactor::after {
    content: ""; position: absolute; border-radius: 50%; border: 3px solid transparent;
  }
  .reactor::before {
    inset: 2px; border-top-color: var(--cyan); border-bottom-color: var(--cyan);
    animation: spin 7s linear infinite;
  }
  .reactor::after {
    inset: 13px; border-left-color: var(--cyan); border-right-color: var(--cyan);
    animation: spin 4.5s linear infinite reverse;
  }
  body.running .reactor::before { animation-duration: 1.1s; }
  body.running .reactor::after { animation-duration: .8s; }
  body.offline .reactor { filter: grayscale(1) brightness(.55); box-shadow: none; }
  body.offline .reactor::before, body.offline .reactor::after { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }

  h1 { margin: 0; font: 700 clamp(30px, 8vw, 46px)/1 var(--mono); letter-spacing: .22em; color: var(--cyan); }
  .tagline { margin: 7px 0 0; color: var(--muted); font-size: 14px; }
  .status {
    margin-left: auto; flex: none; padding: 7px 12px; border: 1px solid currentColor; border-radius: 999px;
    font: 700 12px/1 var(--mono); letter-spacing: .1em; color: var(--green);
  }
  body.running .status { color: var(--amber); }
  body.offline .status { color: var(--red); }

  .notice {
    margin: 0 0 16px; padding: 11px 14px; border-left: 3px solid var(--amber);
    border-radius: 4px; background: rgba(255, 200, 87, .09); font-size: 14px; line-height: 1.45;
  }
  .notice[hidden] { display: none; }
  .notice.bad { border-left-color: var(--red); background: rgba(255, 77, 94, .12); }

  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 760px) { .grid { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); } .wide { grid-column: 1 / -1; } }

  .panel { position: relative; padding: 16px; border: 1px solid var(--panel-edge); border-radius: 8px; background: var(--panel); }
  .panel::before, .panel::after {
    content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--cyan-dim); pointer-events: none;
  }
  .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: 8px; }
  .panel::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: 8px; }
  h2 { margin: 0 0 14px; font: 700 13px/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

  .moves { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .42; }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .move {
    min-height: 58px; padding: 10px; border: 1px solid var(--cyan-dim); border-radius: 6px;
    background: linear-gradient(180deg, #13263a, #0c1828);
    font: 700 14px/1.2 var(--mono); text-transform: capitalize;
    transition: border-color .15s, box-shadow .15s, transform .1s;
  }
  .move:hover:not(:disabled) { border-color: var(--cyan); box-shadow: 0 0 14px rgba(79, 227, 255, .3); }
  .move:active:not(:disabled) { transform: translateY(1px); }
  .move.active { border-color: var(--amber); color: var(--amber); opacity: 1; }

  .joint { padding: 13px 0; border-top: 1px solid var(--panel-edge); }
  .joint:first-of-type { padding-top: 0; border-top: 0; }
  .joint:last-child { padding-bottom: 0; }
  .joint-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; }
  .joint-name { font-weight: 700; text-transform: capitalize; }
  .tag { font: 12px var(--mono); color: var(--muted); }
  .angle { margin-left: auto; font: 700 21px/1 var(--mono); color: var(--cyan); }
  input[type="range"] { display: block; width: 100%; height: 30px; margin: 0; accent-color: var(--cyan); cursor: pointer; }
  input[type="range"]:disabled { cursor: not-allowed; opacity: .4; }
  .joint-foot { display: flex; justify-content: space-between; gap: 10px; margin-top: 3px; font: 12px var(--mono); color: var(--muted); }
  .unlock {
    margin-top: 9px; padding: 8px 11px; border: 1px solid var(--amber); border-radius: 5px;
    background: transparent; color: var(--amber); font-size: 13px; text-align: left;
  }

  #log { margin: 0; padding: 0; min-height: 76px; list-style: none; font: 13px/1.6 var(--mono); }
  #log li { overflow-wrap: anywhere; color: var(--muted); }
  #log li:first-child { color: var(--text); }
  #log li.bad { color: var(--red); }
  #log time { margin-right: 8px; color: var(--cyan-dim); }
  .hint { margin: 13px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }

  .stop-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 11px 16px calc(11px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--panel-edge); background: rgba(7, 11, 20, .93);
  }
  #stop {
    display: block; width: 100%; max-width: 960px; min-height: 60px; margin: 0 auto;
    border: 2px solid var(--red); border-radius: 8px; background: var(--red-deep); color: #fff;
    font: 800 20px/1 var(--mono); letter-spacing: .28em;
  }
  #stop:hover:not(:disabled) { background: #c81d30; box-shadow: 0 0 20px rgba(255, 77, 94, .5); }
  #stop small { display: block; margin-top: 5px; font: 11px var(--sans); letter-spacing: normal; opacity: .9; }

  @media (max-width: 480px) {
    header { flex-wrap: wrap; gap: 14px; }
    .reactor { width: 58px; height: 58px; }
    .status { margin-left: 0; order: 3; }
    h1 { letter-spacing: .16em; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reactor::before, .reactor::after { animation: none; }
    .move { transition: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="reactor" aria-hidden="true"></div>
    <div>
      <h1>JARVIS</h1>
      <p class="tagline">Robotic arm control</p>
    </div>
    <div class="status" id="status" role="status">CONNECTING</div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <div class="grid">
    <section class="panel" aria-labelledby="moves-title">
      <h2 id="moves-title">Routines</h2>
      <div class="moves" id="moves"></div>
      <p class="hint">Keep hands clear. Jarvis sends commands but can't see the arm, so watch it to confirm it moved.</p>
    </section>

    <section class="panel" aria-labelledby="joints-title">
      <h2 id="joints-title">Joints</h2>
      <div id="joints"></div>
    </section>

    <section class="panel wide" aria-labelledby="log-title">
      <h2 id="log-title">Activity</h2>
      <ul id="log" aria-live="polite"></ul>
    </section>
  </div>
</div>

<div class="stop-bar">
  <button id="stop" type="button">STOP<small>Cancels the move and relaxes the servos. A raised arm may drop.</small></button>
</div>

<script>
  const movesEl = document.getElementById("moves");
  const jointsEl = document.getElementById("joints");
  const logEl = document.getElementById("log");
  const statusEl = document.getElementById("status");
  const noticeEl = document.getElementById("notice");
  const stopEl = document.getElementById("stop");

  const unlocked = new Set();
  const dragging = new Set();
  const jointUi = new Map();
  const moveButtons = new Map();
  let state = null;
  let online = false;
  let holdSeconds = 10;

  async function api(path, body) {
    const options = body === undefined
      ? { cache: "no-store" }
      : { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
    const response = await fetch(path, options);
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || "Jarvis had a problem.");
    return data;
  }

  function log(message, bad) {
    const item = document.createElement("li");
    if (bad) item.className = "bad";
    const time = document.createElement("time");
    time.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
    item.append(time, message);
    logEl.prepend(item);
    while (logEl.children.length > 7) logEl.lastChild.remove();
  }

  function label(name) {
    return name.replace(/_/g, " ");
  }

  function buildMoves(moves) {
    for (const name of moves) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "move";
      button.textContent = label(name);
      button.addEventListener("click", () => send(`Running ${label(name)}`, "/api/move", { move: name }));
      movesEl.append(button);
      moveButtons.set(name, button);
    }
  }

  function buildJoints(joints) {
    for (const joint of joints) {
      const wrap = document.createElement("div");
      wrap.className = "joint";

      const head = document.createElement("div");
      head.className = "joint-head";
      const name = document.createElement("span");
      name.className = "joint-name";
      name.textContent = joint.name;
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = `ch ${joint.channel}`;
      const angle = document.createElement("span");
      angle.className = "angle";
      angle.textContent = "--";
      head.append(name, tag, angle);

      const slider = document.createElement("input");
      slider.type = "range";
      slider.min = joint.low;
      slider.max = joint.high;
      slider.step = 1;
      slider.value = joint.last_angle ?? Math.round((joint.low + joint.high) / 2);
      slider.setAttribute("aria-label", `${joint.name} angle`);

      const foot = document.createElement("div");
      foot.className = "joint-foot";
      const low = document.createElement("span");
      low.textContent = `${joint.low}°`;
      const note = document.createElement("span");
      const high = document.createElement("span");
      high.textContent = `${joint.high}°`;
      foot.append(low, note, high);

      wrap.append(head, slider, foot);

      slider.addEventListener("input", () => {
        dragging.add(joint.name);
        angle.textContent = `${slider.value}°`;
      });
      slider.addEventListener("change", async () => {
        const target = Number(slider.value);
        await send(`${joint.name} to ${target}°`, "/api/joint", { joint: joint.name, angle: target });
        dragging.delete(joint.name);
        refreshControls();
      });

      let unlock = null;
      if (!joint.tested) {
        unlock = document.createElement("button");
        unlock.type = "button";
        unlock.className = "unlock";
        unlock.textContent = "Not tested yet. Unlock only when it's safely connected.";
        unlock.addEventListener("click", () => {
          unlocked.add(joint.name);
          unlock.remove();
          refreshControls();
          log(`${joint.name} unlocked`);
        });
        wrap.append(unlock);
      }

      jointsEl.append(wrap);
      jointUi.set(joint.name, { slider, angle, note });
    }
  }

  async function send(message, path, body) {
    log(`${message}: sending`);
    try {
      apply(await api(path, body));
      log(`${message}: sent`);
    } catch (problem) {
      log(`${message}: ${problem.message}`, true);
    }
  }

  function apply(next) {
    const first = !state;
    state = next;
    holdSeconds = next.hold_seconds;
    if (first) {
      buildMoves(next.moves);
      buildJoints(next.joints);
    }
    refreshControls();
  }

  function refreshControls() {
    if (!state) return;
    const running = Boolean(state.running);
    document.body.classList.toggle("running", online && running);
    document.body.classList.toggle("offline", !online);
    statusEl.textContent = !online ? "OFFLINE" : running ? "RUNNING" : "ONLINE";

    if (!online) {
      showNotice("Jarvis isn't answering. Check that the Pi is on and on this network.", true);
    } else if (state.error) {
      showNotice(`${state.error} Check the wiring and the Pi.`, true);
    } else if (running) {
      showNotice(`Running ${label(state.running)}${state.step ? `: ${state.step}°` : ""}`, false);
    } else {
      noticeEl.hidden = true;
    }

    for (const [name, button] of moveButtons) {
      button.disabled = !online || running;
      button.classList.toggle("active", state.running === name);
    }
    for (const joint of state.joints) {
      const ui = jointUi.get(joint.name);
      if (!ui) continue;
      const usable = joint.tested || unlocked.has(joint.name);
      ui.slider.disabled = !online || running || !usable;
      if (dragging.has(joint.name)) continue;
      if (joint.last_angle !== null) {
        ui.slider.value = joint.last_angle;
        ui.angle.textContent = `${joint.last_angle}°`;
      }
      ui.note.textContent = joint.held
        ? `holding, relaxes in ${holdSeconds}s`
        : joint.last_angle === null ? "not moved yet" : "relaxed";
    }
    stopEl.disabled = !online;
  }

  function showNotice(message, bad) {
    noticeEl.textContent = message;
    noticeEl.classList.toggle("bad", bad);
    noticeEl.hidden = false;
  }

  stopEl.addEventListener("click", () => send("Stop", "/api/stop", {}));

  async function poll() {
    try {
      const next = await api("/api/state");
      if (!online) {
        online = true;
        log("Jarvis connected");
      }
      apply(next);
    } catch {
      if (online) log("Lost connection to Jarvis", true);
      online = false;
      document.body.classList.add("offline");
      statusEl.textContent = "OFFLINE";
      refreshControls();
      if (!state) showNotice("Jarvis isn't answering. Check that the Pi is on and on this network.", true);
    }
  }

  poll();
  setInterval(poll, 1000);
</script>
</body>
</html>
