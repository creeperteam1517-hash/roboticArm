<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Jarvis</title>
<style>
  :root {
    --bg: #070b14;
    --panel: #0e1626;
    --raise: #16233a;
    --edge: #1f3350;
    --text: #dcebfa;
    --muted: #8ea5bd;
    --cyan: #4fe3ff;
    --cyan-dim: #1b7f99;
    --amber: #ffc857;
    --red: #ff4d5e;
    --red-deep: #a31525;
    --green: #5ff0a5;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--text);
    font: 16px/1.5 var(--sans);
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(79, 227, 255, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79, 227, 255, .045) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .app {
    display: flex; flex-direction: column; height: 100%; max-width: 820px; margin: 0 auto;
    padding: calc(12px + env(safe-area-inset-top)) 16px calc(12px + env(safe-area-inset-bottom));
  }

  header { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; }
  .reactor {
    position: relative; flex: none; width: 52px; height: 52px; border-radius: 50%;
    background: radial-gradient(circle, #e8fbff 0 10%, var(--cyan) 18%, #0c3a4a 42%, #08121e 66%);
    box-shadow: 0 0 18px rgba(79, 227, 255, .45);
  }
  .reactor::before, .reactor::after { content: ""; position: absolute; border-radius: 50%; border: 2px solid transparent; }
  .reactor::before { inset: 2px; border-top-color: var(--cyan); border-bottom-color: var(--cyan); animation: spin 7s linear infinite; }
  .reactor::after { inset: 10px; border-left-color: var(--cyan); border-right-color: var(--cyan); animation: spin 4.5s linear infinite reverse; }
  body.thinking .reactor::before { animation-duration: 1.1s; }
  body.thinking .reactor::after { animation-duration: .8s; }
  body.speaking .reactor { box-shadow: 0 0 30px rgba(79, 227, 255, .8); }
  body.offline .reactor { filter: grayscale(1) brightness(.55); box-shadow: none; }
  body.offline .reactor::before, body.offline .reactor::after { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0; font: 700 30px/1 var(--mono); letter-spacing: .2em; color: var(--cyan); }
  .status { margin-top: 5px; font: 700 11px/1 var(--mono); letter-spacing: .12em; color: var(--green); }
  body.thinking .status { color: var(--amber); }
  body.offline .status { color: var(--red); }
  .tools { margin-left: auto; display: flex; gap: 8px; }
  .tool {
    min-height: 36px; padding: 6px 11px; border: 1px solid var(--edge); border-radius: 999px;
    background: transparent; color: var(--muted); font: 12px var(--mono); cursor: pointer;
  }
  .tool[aria-pressed="true"] { border-color: var(--cyan-dim); color: var(--cyan); }
  .tool:hover { color: var(--text); }

  .notice { margin: 0 0 10px; padding: 10px 13px; border-left: 3px solid var(--amber); border-radius: 4px; background: rgba(255, 200, 87, .09); font-size: 14px; }
  .notice.bad { border-left-color: var(--red); background: rgba(255, 77, 94, .12); }
  .notice[hidden] { display: none; }
  .notice code { font-family: var(--mono); color: var(--cyan); }

  .log {
    flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px;
    padding: 16px; border: 1px solid var(--edge); border-radius: 10px; background: rgba(14, 22, 38, .9);
  }
  .msg { max-width: 85%; overflow-wrap: anywhere; }
  .msg .who { margin-bottom: 3px; font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .msg.you { align-self: flex-end; }
  .msg.you .who { text-align: right; }
  .msg.you .body { padding: 9px 13px; border-radius: 12px 12px 3px 12px; background: var(--raise); white-space: pre-wrap; }
  .msg.ai .who { color: var(--cyan); }
  .msg.ai .body { padding-left: 13px; border-left: 2px solid var(--cyan); white-space: pre-wrap; }
  .msg.ai.bad .body { border-left-color: var(--red); }
  .msg .acts { margin-top: 5px; padding-left: 15px; font: 12px var(--mono); color: var(--amber); }
  .msg.note { align-self: center; max-width: 100%; font: 12px var(--mono); color: var(--muted); text-align: center; }
  .dots::after { content: "..."; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1.4em; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0; } to { width: 1.4em; } }

  form { display: flex; gap: 8px; margin-top: 10px; }
  textarea {
    flex: 1; min-width: 0; height: 52px; padding: 13px 14px; resize: none;
    border: 1px solid var(--edge); border-radius: 10px; background: var(--panel); color: var(--text); font: inherit;
  }
  .send {
    flex: none; padding: 0 20px; border: 0; border-radius: 10px; background: var(--cyan); color: #04202a;
    font: 800 15px var(--mono); letter-spacing: .12em; cursor: pointer;
  }
  .send:disabled { opacity: .45; cursor: not-allowed; }
  textarea:focus-visible, button:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

  #stop {
    width: 100%; min-height: 52px; margin-top: 10px; border: 2px solid var(--red); border-radius: 10px;
    background: var(--red-deep); color: #fff; font: 800 18px var(--mono); letter-spacing: .26em; cursor: pointer;
  }
  #stop small { display: block; margin-top: 3px; font: 11px var(--sans); letter-spacing: normal; opacity: .9; }
  #stop:hover:not(:disabled) { background: #c81d30; }
  #stop:disabled { opacity: .45; cursor: not-allowed; }

  @media (max-width: 480px) {
    h1 { font-size: 24px; }
    .reactor { width: 44px; height: 44px; }
    .tool { padding: 6px 9px; }
    .msg { max-width: 92%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reactor::before, .reactor::after, .dots::after { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="reactor" aria-hidden="true"></div>
    <div>
      <h1>JARVIS</h1>
      <div class="status" id="status" role="status">CONNECTING</div>
    </div>
    <div class="tools">
      <button class="tool" id="voice" type="button" aria-pressed="true">Voice on</button>
      <button class="tool" id="newChat" type="button">New chat</button>
    </div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <div class="log" id="log" aria-live="polite"></div>

  <form id="form">
    <textarea id="input" placeholder="Ask Jarvis anything, or tell it to move the arm" aria-label="Message Jarvis"></textarea>
    <button class="send" id="send" type="submit">SEND</button>
  </form>

  <button id="stop" type="button">STOP<small>Stops the arm and relaxes the servos. A raised arm may drop.</small></button>
</div>

<script>
  const logEl = document.getElementById("log");
  const input = document.getElementById("input");
  const sendEl = document.getElementById("send");
  const statusEl = document.getElementById("status");
  const noticeEl = document.getElementById("notice");
  const stopEl = document.getElementById("stop");
  const voiceEl = document.getElementById("voice");

  let online = false;
  let thinking = false;
  let state = null;
  let audio = null;
  let voiceOn = true;
  try { voiceOn = localStorage.getItem("jarvis-voice") !== "off"; } catch {}

  async function post(path, body) {
    const response = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data.error || "Jarvis had a problem.");
    }
    return response;
  }

  function addMessage(kind, text) {
    const wrap = document.createElement("div");
    wrap.className = `msg ${kind}`;
    if (kind !== "note") {
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = kind === "you" ? "You" : "Jarvis";
      wrap.append(who);
    }
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text;
    wrap.append(body);
    logEl.append(wrap);
    logEl.scrollTop = logEl.scrollHeight;
    return wrap;
  }

  function addActions(wrap, actions) {
    if (!actions.length) return;
    const acts = document.createElement("div");
    acts.className = "acts";
    acts.textContent = actions.join(" · ");
    wrap.append(acts);
  }

  function greet() {
    addMessage("ai", "Good day. I can answer questions and move the arm when you ask. I can't see it, so do watch it for me, and keep your hands clear.");
  }

  function paint() {
    document.body.classList.toggle("thinking", online && thinking);
    document.body.classList.toggle("offline", !online);
    statusEl.textContent = !online ? "OFFLINE" : thinking ? "THINKING" : state && state.running ? "MOVING" : "ONLINE";
    sendEl.disabled = !online || thinking || !(state && state.chat_ready);
    stopEl.disabled = !online;
    voiceEl.setAttribute("aria-pressed", voiceOn);
    voiceEl.textContent = voiceOn ? "Voice on" : "Voice off";

    if (!online) {
      showNotice("Jarvis isn't answering. Check that the Pi is on and on this network.", true);
    } else if (state && !state.chat_ready) {
      showNotice("Jarvis needs its Claude key before it can chat. On your PC, run .\\set_keys", false);
    } else if (state && state.error) {
      showNotice(`${state.error} Check the wiring and the Pi.`, true);
    } else {
      noticeEl.hidden = true;
    }
  }

  function showNotice(message, bad) {
    noticeEl.textContent = message;
    noticeEl.classList.toggle("bad", bad);
    noticeEl.hidden = false;
  }

  function stopTalking() {
    if (audio) { audio.pause(); audio = null; }
    try { speechSynthesis.cancel(); } catch {}
    document.body.classList.remove("speaking");
  }

  function backupVoice(text) {
    if (!("speechSynthesis" in window)) return;
    const voices = speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
    const british = voices.filter((v) => /en[-_]GB/i.test(v.lang));
    const pick = british.find((v) => /george|daniel|arthur|male|ryan|oliver/i.test(v.name)) || british[0] || voices[0];
    const line = new SpeechSynthesisUtterance(text);
    if (pick) line.voice = pick;
    line.lang = pick ? pick.lang : "en-GB";
    line.onstart = () => document.body.classList.add("speaking");
    line.onend = line.onerror = () => document.body.classList.remove("speaking");
    speechSynthesis.speak(line);
  }

  async function say(text) {
    if (!voiceOn || !text) return;
    stopTalking();
    if (state && state.voice_ready) {
      try {
        const response = await post("/api/speak", { text });
        const url = URL.createObjectURL(await response.blob());
        audio = new Audio(url);
        audio.onplay = () => document.body.classList.add("speaking");
        audio.onended = audio.onerror = () => { document.body.classList.remove("speaking"); URL.revokeObjectURL(url); };
        await audio.play();
        return;
      } catch {
        // Fall back to the browser's own voice below.
      }
    }
    backupVoice(text);
  }

  async function send(text) {
    addMessage("you", text);
    const pending = addMessage("ai", "");
    pending.querySelector(".body").classList.add("dots");
    thinking = true;
    paint();
    try {
      const data = await (await post("/api/chat", { message: text })).json();
      if (data.fresh_start) addMessage("note", "Started a fresh chat to keep things quick.");
      pending.querySelector(".body").classList.remove("dots");
      pending.querySelector(".body").textContent = data.reply;
      addActions(pending, data.actions);
      logEl.scrollTop = logEl.scrollHeight;
      say(data.reply);
    } catch (problem) {
      pending.classList.add("bad");
      pending.querySelector(".body").classList.remove("dots");
      pending.querySelector(".body").textContent = problem.message;
    } finally {
      thinking = false;
      paint();
      input.focus();
    }
  }

  document.getElementById("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || sendEl.disabled) return;
    input.value = "";
    send(text);
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      document.getElementById("form").requestSubmit();
    }
  });

  stopEl.addEventListener("click", async () => {
    stopTalking();
    try {
      await post("/api/stop");
      addMessage("note", "Stop sent. The servos are relaxed.");
    } catch (problem) {
      addMessage("note", `Stop failed: ${problem.message}`);
    }
  });

  voiceEl.addEventListener("click", () => {
    voiceOn = !voiceOn;
    try { localStorage.setItem("jarvis-voice", voiceOn ? "on" : "off"); } catch {}
    if (!voiceOn) stopTalking();
    paint();
  });

  document.getElementById("newChat").addEventListener("click", async () => {
    stopTalking();
    try {
      await post("/api/chat/reset");
      logEl.textContent = "";
      greet();
    } catch (problem) {
      addMessage("note", `Couldn't start a new chat: ${problem.message}`);
    }
  });

  async function poll() {
    try {
      const response = await fetch("/api/state", { cache: "no-store" });
      if (!response.ok) throw new Error();
      state = await response.json();
      online = true;
    } catch {
      online = false;
    }
    paint();
  }

  greet();
  poll();
  setInterval(poll, 2000);
</script>
</body>
</html>
