<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Jarvis</title>
<style>
  :root {
    --bg: #070b14;
    --panel: #0e1626;
    --raise: #16233a;
    --edge: #1f3350;
    --text: #dcebfa;
    --muted: #8ea5bd;
    --cyan: #4fe3ff;
    --cyan-dim: #1b7f99;
    --amber: #ffc857;
    --red: #ff4d5e;
    --red-deep: #a31525;
    --green: #5ff0a5;
    --mono: ui-monospace, "Cascadia Code", "SF Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    padding: calc(12px + env(safe-area-inset-top)) 16px 112px;
    color: var(--text);
    font: 16px/1.5 var(--sans);
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(79, 227, 255, .045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79, 227, 255, .045) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  .shell { max-width: 1080px; margin: 0 auto; }

  header { display: flex; align-items: center; gap: 14px; padding-bottom: 14px; flex-wrap: wrap; }
  .reactor {
    position: relative; flex: none; width: 56px; height: 56px; border-radius: 50%;
    background: radial-gradient(circle, #e8fbff 0 10%, var(--cyan) 18%, #0c3a4a 42%, #08121e 66%);
    box-shadow: 0 0 20px rgba(79, 227, 255, .45);
  }
  .reactor::before, .reactor::after { content: ""; position: absolute; border-radius: 50%; border: 2px solid transparent; }
  .reactor::before { inset: 2px; border-top-color: var(--cyan); border-bottom-color: var(--cyan); animation: spin 7s linear infinite; }
  .reactor::after { inset: 11px; border-left-color: var(--cyan); border-right-color: var(--cyan); animation: spin 4.5s linear infinite reverse; }
  body.busy .reactor::before { animation-duration: 1.1s; }
  body.busy .reactor::after { animation-duration: .8s; }
  body.speaking .reactor { box-shadow: 0 0 32px rgba(79, 227, 255, .85); }
  body.offline .reactor { filter: grayscale(1) brightness(.55); box-shadow: none; }
  body.offline .reactor::before, body.offline .reactor::after { animation-play-state: paused; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { margin: 0; font: 700 32px/1 var(--mono); letter-spacing: .2em; color: var(--cyan); }
  .status { margin-top: 6px; font: 700 11px/1 var(--mono); letter-spacing: .12em; color: var(--green); }
  body.busy .status { color: var(--amber); }
  body.offline .status { color: var(--red); }
  .tools { margin-left: auto; display: flex; gap: 8px; }
  .tool {
    min-height: 36px; padding: 6px 12px; border: 1px solid var(--edge); border-radius: 999px;
    background: transparent; color: var(--muted); font: 12px var(--mono); cursor: pointer;
  }
  .tool[aria-pressed="true"] { border-color: var(--cyan-dim); color: var(--cyan); }
  .tool:hover { color: var(--text); }

  .notice { margin: 0 0 14px; padding: 10px 13px; border-left: 3px solid var(--amber); border-radius: 4px; background: rgba(255, 200, 87, .09); font-size: 14px; }
  .notice.bad { border-left-color: var(--red); background: rgba(255, 77, 94, .12); }
  .notice[hidden] { display: none; }

  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
  .controls { display: grid; gap: 16px; align-content: start; }
  @media (min-width: 900px) {
    .grid { grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); }
    .controls { order: 0; }
    .chat { order: 1; position: sticky; top: 12px; height: calc(100vh - 210px); min-height: 420px; }
  }
  @media (max-width: 899px) {
    .chat { order: -1; height: 62vh; min-height: 340px; }
  }

  .panel { position: relative; padding: 16px; border: 1px solid var(--edge); border-radius: 10px; background: var(--panel); }
  .panel::before, .panel::after { content: ""; position: absolute; width: 14px; height: 14px; border: 2px solid var(--cyan-dim); pointer-events: none; }
  .panel::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; border-top-left-radius: 10px; }
  .panel::after { right: -1px; bottom: -1px; border-left: 0; border-top: 0; border-bottom-right-radius: 10px; }
  h2 { margin: 0 0 12px; font: 700 13px/1.2 var(--mono); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

  .chat { display: flex; flex-direction: column; padding: 0; }
  .chat h2 { margin: 0; padding: 14px 16px 0; }
  .log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; padding: 14px 16px; }
  .msg { max-width: 88%; overflow-wrap: anywhere; }
  .msg .who { margin-bottom: 3px; font: 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .msg.you { align-self: flex-end; }
  .msg.you .who { text-align: right; }
  .msg.you .body { padding: 9px 13px; border-radius: 12px 12px 3px 12px; background: var(--raise); white-space: pre-wrap; }
  .msg.ai .who { color: var(--cyan); }
  .msg.ai .body { padding-left: 13px; border-left: 2px solid var(--cyan); white-space: pre-wrap; }
  .msg.ai.bad .body { border-left-color: var(--red); }
  .msg .acts { margin-top: 5px; padding-left: 15px; font: 12px var(--mono); color: var(--amber); }
  .msg.note { align-self: center; max-width: 100%; font: 12px var(--mono); color: var(--muted); text-align: center; }
  .msg.note.bad { color: var(--red); }
  .dots::after { content: "..."; animation: dots 1.2s steps(4) infinite; display: inline-block; width: 1.4em; overflow: hidden; vertical-align: bottom; }
  @keyframes dots { from { width: 0; } to { width: 1.4em; } }
  form { display: flex; gap: 8px; padding: 0 16px 16px; }
  textarea {
    flex: 1; min-width: 0; height: 50px; padding: 12px 14px; resize: none;
    border: 1px solid var(--edge); border-radius: 10px; background: var(--bg); color: var(--text); font: inherit;
  }
  .send { flex: none; padding: 0 18px; border: 0; border-radius: 10px; background: var(--cyan); color: #04202a; font: 800 14px var(--mono); letter-spacing: .12em; cursor: pointer; }
  .send:disabled { opacity: .45; cursor: not-allowed; }

  .moves { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { cursor: not-allowed; opacity: .42; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
  .move {
    min-height: 54px; padding: 10px; border: 1px solid var(--cyan-dim); border-radius: 8px;
    background: linear-gradient(180deg, #13263a, #0c1828); font: 700 14px/1.2 var(--mono); text-transform: capitalize;
  }
  .move:hover:not(:disabled) { border-color: var(--cyan); box-shadow: 0 0 14px rgba(79, 227, 255, .3); }
  .move.active { border-color: var(--amber); color: var(--amber); opacity: 1; }

  .joint { padding: 12px 0; border-top: 1px solid var(--edge); }
  .joint:first-child { padding-top: 0; border-top: 0; }
  .joint:last-child { padding-bottom: 0; }
  .joint-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .joint-name { font-weight: 700; text-transform: capitalize; }
  .tag { font: 12px var(--mono); color: var(--muted); }
  .angle { margin-left: auto; font: 700 20px/1 var(--mono); color: var(--cyan); }
  input[type="range"] { display: block; width: 100%; height: 30px; margin: 0; accent-color: var(--cyan); cursor: pointer; }
  input[type="range"]:disabled { cursor: not-allowed; opacity: .4; }
  .joint-foot { display: flex; justify-content: space-between; gap: 10px; font: 12px var(--mono); color: var(--muted); }
  .unlock { margin-top: 8px; padding: 8px 11px; border: 1px solid var(--amber); border-radius: 6px; background: transparent; color: var(--amber); font-size: 13px; text-align: left; }
  .hint { margin: 12px 0 0; color: var(--muted); font-size: 13px; line-height: 1.45; }

  .stop-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--edge); background: rgba(7, 11, 20, .94);
  }
  #stop {
    display: block; width: 100%; max-width: 1080px; min-height: 58px; margin: 0 auto;
    border: 2px solid var(--red); border-radius: 10px; background: var(--red-deep); color: #fff;
    font: 800 19px/1 var(--mono); letter-spacing: .28em;
  }
  #stop small { display: block; margin-top: 5px; font: 11px var(--sans); letter-spacing: normal; opacity: .9; }
  #stop:hover:not(:disabled) { background: #c81d30; box-shadow: 0 0 20px rgba(255, 77, 94, .5); }

  @media (max-width: 480px) {
    h1 { font-size: 26px; }
    .reactor { width: 46px; height: 46px; }
    .tools { margin-left: 0; width: 100%; }
    .tool { flex: 1; }
    .msg { max-width: 94%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .reactor::before, .reactor::after, .dots::after { animation: none; }
  }
</style>
</head>
<body>
<div class="shell">
  <header>
    <div class="reactor" aria-hidden="true"></div>
    <div>
      <h1>JARVIS</h1>
      <div class="status" id="status" role="status">CONNECTING</div>
    </div>
    <div class="tools">
      <button class="tool" id="voice" type="button" aria-pressed="true">Voice on</button>
      <button class="tool" id="newChat" type="button">New chat</button>
    </div>
  </header>

  <p class="notice" id="notice" hidden></p>

  <div class="grid">
    <section class="panel chat" aria-labelledby="chat-title">
      <h2 id="chat-title">Chat</h2>
      <div class="log" id="log" aria-live="polite"></div>
      <form id="form">
        <textarea id="input" aria-label="Message Jarvis"></textarea>
        <button class="send" id="send" type="submit">SEND</button>
      </form>
    </section>

    <div class="controls">
      <section class="panel" aria-labelledby="moves-title">
        <h2 id="moves-title">Routines</h2>
        <div class="moves" id="moves"></div>
        <p class="hint">Keep hands clear. Jarvis sends commands but can't see the arm, so watch it to confirm it moved.</p>
      </section>
      <section class="panel" aria-labelledby="joints-title">
        <h2 id="joints-title">Joints</h2>
        <div id="joints"></div>
      </section>
    </div>
  </div>
</div>

<div class="stop-bar">
  <button id="stop" type="button">STOP<small>Cancels the move and relaxes the servos. A raised arm may drop.</small></button>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const logEl = $("log"), input = $("input"), sendEl = $("send"), statusEl = $("status");
  const noticeEl = $("notice"), stopEl = $("stop"), voiceEl = $("voice");
  const movesEl = $("moves"), jointsEl = $("joints");

  const unlocked = new Set();
  const dragging = new Set();
  const jointUi = new Map();
  const moveButtons = new Map();
  let state = null;
  let online = false;
  let thinking = false;
  let audio = null;
  let voiceOn = true;
  try { voiceOn = localStorage.getItem("jarvis-voice") !== "off"; } catch {}

  async function post(path, body) {
    const response = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data.error || "Jarvis had a problem.");
    }
    return response;
  }

  /* ---------- chat log ---------- */
  function addMessage(kind, text, bad) {
    const wrap = document.createElement("div");
    wrap.className = `msg ${kind}${bad ? " bad" : ""}`;
    if (kind !== "note") {
      const who = document.createElement("div");
      who.className = "who";
      who.textContent = kind === "you" ? "You" : "Jarvis";
      wrap.append(who);
    }
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = text;
    wrap.append(body);
    logEl.append(wrap);
    logEl.scrollTop = logEl.scrollHeight;
    return wrap;
  }

  function greet() {
    addMessage("ai", "Good day. Use the buttons and sliders, or ask me in your own words. I can't see the arm, so do watch it for me, and keep your hands clear.");
  }

  /* ---------- voice ---------- */
  function stopTalking() {
    if (audio) { audio.pause(); audio = null; }
    try { speechSynthesis.cancel(); } catch {}
    document.body.classList.remove("speaking");
  }

  function backupVoice(text) {
    if (!("speechSynthesis" in window)) return;
    const voices = speechSynthesis.getVoices().filter((v) => /^en/i.test(v.lang));
    const british = voices.filter((v) => /en[-_]GB/i.test(v.lang));
    const pick = british.find((v) => /george|daniel|arthur|male|ryan|oliver/i.test(v.name)) || british[0] || voices[0];
    const line = new SpeechSynthesisUtterance(text);
    if (pick) line.voice = pick;
    line.lang = pick ? pick.lang : "en-GB";
    line.onstart = () => document.body.classList.add("speaking");
    line.onend = line.onerror = () => document.body.classList.remove("speaking");
    speechSynthesis.speak(line);
  }

  async function say(text) {
    if (!voiceOn || !text) return;
    stopTalking();
    if (state && state.voice_ready) {
      try {
        const url = URL.createObjectURL(await (await post("/api/speak", { text })).blob());
        audio = new Audio(url);
        audio.onplay = () => document.body.classList.add("speaking");
        audio.onended = audio.onerror = () => { document.body.classList.remove("speaking"); URL.revokeObjectURL(url); };
        await audio.play();
        return;
      } catch {
        // Fall back to the browser's own voice below.
      }
    }
    backupVoice(text);
  }

  /* ---------- chat ---------- */
  async function chat(text) {
    addMessage("you", text);
    const pending = addMessage("ai", "");
    const body = pending.querySelector(".body");
    body.classList.add("dots");
    thinking = true;
    refresh();
    try {
      const data = await (await post("/api/chat", { message: text })).json();
      if (data.fresh_start) addMessage("note", "Started a fresh chat to keep things quick.");
      body.classList.remove("dots");
      body.textContent = data.reply;
      if (data.actions.length) {
        const acts = document.createElement("div");
        acts.className = "acts";
        acts.textContent = data.actions.join(" · ");
        pending.append(acts);
      }
      logEl.scrollTop = logEl.scrollHeight;
      say(data.reply);
    } catch (problem) {
      pending.classList.add("bad");
      body.classList.remove("dots");
      body.textContent = problem.message;
    } finally {
      thinking = false;
      refresh();
      poll();
    }
  }

  $("form").addEventListener("submit", (event) => {
    event.preventDefault();
    const text = input.value.trim();
    if (!text || sendEl.disabled) return;
    input.value = "";
    chat(text);
  });
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      $("form").requestSubmit();
    }
  });

  /* ---------- buttons and sliders ---------- */
  async function control(message, path, body) {
    try {
      state = await (await post(path, body)).json();
      addMessage("note", `${message}: sent`);
    } catch (problem) {
      addMessage("note", `${message}: ${problem.message}`, true);
    }
    refresh();
  }

  const label = (name) => name.replace(/_/g, " ");

  function buildMoves(moves) {
    for (const name of moves) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "move";
      button.textContent = label(name);
      button.addEventListener("click", () => control(`Running ${label(name)}`, "/api/move", { move: name }));
      movesEl.append(button);
      moveButtons.set(name, button);
    }
  }

  function buildJoints(joints) {
    for (const joint of joints) {
      const wrap = document.createElement("div");
      wrap.className = "joint";
      const head = document.createElement("div");
      head.className = "joint-head";
      const name = document.createElement("span");
      name.className = "joint-name";
      name.textContent = joint.name;
      const tag = document.createElement("span");
      tag.className = "tag";
      tag.textContent = `ch ${joint.channel}`;
      const angle = document.createElement("span");
      angle.className = "angle";
      angle.textContent = "--";
      head.append(name, tag, angle);

      const slider = document.createElement("input");
      slider.type = "range";
      slider.min = joint.low;
      slider.max = joint.high;
      slider.step = 1;
      slider.value = joint.last_angle ?? Math.round((joint.low + joint.high) / 2);
      slider.setAttribute("aria-label", `${joint.name} angle`);

      const foot = document.createElement("div");
      foot.className = "joint-foot";
      const low = document.createElement("span");
      low.textContent = `${joint.low}°`;
      const note = document.createElement("span");
      const high = document.createElement("span");
      high.textContent = `${joint.high}°`;
      foot.append(low, note, high);
      wrap.append(head, slider, foot);

      slider.addEventListener("input", () => {
        dragging.add(joint.name);
        angle.textContent = `${slider.value}°`;
      });
      slider.addEventListener("change", async () => {
        await control(`${joint.name} to ${slider.value}°`, "/api/joint", { joint: joint.name, angle: Number(slider.value) });
        dragging.delete(joint.name);
        refresh();
      });

      if (!joint.tested) {
        const unlock = document.createElement("button");
        unlock.type = "button";
        unlock.className = "unlock";
        unlock.textContent = "Not tested yet. Unlock only when it's safely connected.";
        unlock.addEventListener("click", () => {
          unlocked.add(joint.name);
          unlock.remove();
          addMessage("note", `${joint.name} slider unlocked`);
          refresh();
        });
        wrap.append(unlock);
      }
      jointsEl.append(wrap);
      jointUi.set(joint.name, { slider, angle, note });
    }
  }

  /* ---------- screen updates ---------- */
  function showNotice(message, bad) {
    noticeEl.textContent = message;
    noticeEl.classList.toggle("bad", bad);
    noticeEl.hidden = false;
  }

  function refresh() {
    const running = Boolean(state && state.running);
    document.body.classList.toggle("busy", online && (thinking || running));
    document.body.classList.toggle("offline", !online);
    statusEl.textContent = !online ? "OFFLINE" : thinking ? "THINKING" : running ? "MOVING" : "ONLINE";
    voiceEl.setAttribute("aria-pressed", voiceOn);
    voiceEl.textContent = voiceOn ? "Voice on" : "Voice off";
    stopEl.disabled = !online;

    const chatReady = Boolean(state && state.chat_ready);
    sendEl.disabled = !online || thinking || !chatReady;
    input.disabled = !online || !chatReady;
    input.placeholder = chatReady
      ? "Ask Jarvis anything"
      : "Chat needs a Claude key (.\\set_keys)";

    if (!online) {
      showNotice("Jarvis isn't answering. Check that the Pi is on and on this network.", true);
    } else if (state && state.error) {
      showNotice(`${state.error} Check the wiring and the Pi.`, true);
    } else {
      noticeEl.hidden = true;
    }

    if (!state) return;
    for (const [name, button] of moveButtons) {
      button.disabled = !online || running;
      button.classList.toggle("active", state.running === name);
    }
    for (const joint of state.joints) {
      const ui = jointUi.get(joint.name);
      if (!ui) continue;
      ui.slider.disabled = !online || running || !(joint.tested || unlocked.has(joint.name));
      if (dragging.has(joint.name)) continue;
      if (joint.last_angle !== null) {
        ui.slider.value = joint.last_angle;
        ui.angle.textContent = `${joint.last_angle}°`;
      }
      ui.note.textContent = joint.held
        ? `holding, relaxes in ${state.hold_seconds}s`
        : joint.last_angle === null ? "not moved yet" : "relaxed";
    }
  }

  stopEl.addEventListener("click", () => { stopTalking(); control("Stop", "/api/stop", {}); });

  voiceEl.addEventListener("click", () => {
    voiceOn = !voiceOn;
    try { localStorage.setItem("jarvis-voice", voiceOn ? "on" : "off"); } catch {}
    if (!voiceOn) stopTalking();
    refresh();
  });

  $("newChat").addEventListener("click", async () => {
    stopTalking();
    try {
      await post("/api/chat/reset");
      logEl.textContent = "";
      greet();
    } catch (problem) {
      addMessage("note", `Couldn't start a new chat: ${problem.message}`, true);
    }
  });

  async function poll() {
    try {
      const response = await fetch("/api/state", { cache: "no-store" });
      if (!response.ok) throw new Error();
      const next = await response.json();
      if (!state) {
        buildMoves(next.moves);
        buildJoints(next.joints);
      }
      state = next;
      online = true;
    } catch {
      online = false;
    }
    refresh();
  }

  greet();
  poll();
  setInterval(poll, 1500);
</script>
</body>
</html>
